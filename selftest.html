<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>链接测试 · 财富密码</title>
<style>
  body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#3a1010,#12080a 60%);
       color:#f2e4d4;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px;}
  h1{font-size:18px;color:#ffd76e;letter-spacing:.1em;margin:0 0 6px;}
  .sub{font-size:12px;color:#a08b7c;margin-bottom:20px;}
  .row{background:#1d0f13;border:1px solid rgba(255,214,140,.14);border-radius:12px;
       padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
  .st{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:#555;}
  .st.ok{background:#12b886;box-shadow:0 0 10px #12b886;}
  .st.bad{background:#e8453c;box-shadow:0 0 10px #e8453c;}
  .st.run{background:#ffd76e;animation:bl .8s infinite;}
  @keyframes bl{50%{opacity:.3}}
  .name{font-size:13.5px;font-weight:600;}
  .detail{font-size:11.5px;color:#a08b7c;margin-top:3px;word-break:break-all;}
  .val{margin-left:auto;font-size:12px;color:#ffd76e;font-variant-numeric:tabular-nums;white-space:nowrap;}
</style>
</head>
<body>
<h1>链接连通性自检</h1>
<div class="sub">依次检查：Supabase 可达 → 表已建 → 可写入 → 可读取更新</div>
<div id="list"></div>

<script>
const URL_ = "https://mucujjdysvjunpjilcho.supabase.co";
const KEY  = "sb_publishable_U1xfyeUySKLKhHrmt9WU1g_KKoL0M-P";
const H = {"Content-Type":"application/json","apikey":KEY,"Prefer":"return=representation"};
const list = document.getElementById("list");

function row(name){
  const d = document.createElement("div");
  d.className = "row";
  d.innerHTML = `<span class="st run"></span><div><div class="name">${name}</div><div class="detail">检测中…</div></div><div class="val"></div>`;
  list.appendChild(d);
  return d;
}
function set(d, ok, detail, val){
  d.querySelector(".st").className = "st " + (ok ? "ok" : "bad");
  d.querySelector(".detail").textContent = detail;
  d.querySelector(".val").textContent = val || "";
}

let recId = null;

async function test1(){
  const d = row("① Supabase 项目可达");
  try{
    const r = await fetch(URL_ + "/rest/v1/", {headers:{apikey:KEY}});
    if (r.ok) set(d, true, "项目地址与密钥有效", r.status);
    else set(d, false, "返回 " + r.status + "，可能是密钥不对", r.status);
    return r.ok;
  }catch(e){ set(d, false, "网络不通：" + e.message); return false; }
}

async function test2(){
  const d = row("② 数据表 visits 存在");
  try{
    const r = await fetch(URL_ + "/rest/v1/visits?select=id&limit=1", {headers:{apikey:KEY}});
    const t = await r.text();
    if (r.ok) set(d, true, "表已创建", r.status);
    else if (t.includes("PGRST205")) set(d, false, "表不存在 → 请先在 SQL Editor 执行 schema.sql");
    else set(d, false, t.slice(0, 90), r.status);
    return r.ok;
  }catch(e){ set(d, false, e.message); return false; }
}

async function test3(){
  const d = row("③ 写入测试记录");
  try{
    const r = await fetch(URL_ + "/rest/v1/visits", {
      method:"POST", headers:H,
      body: JSON.stringify({
        site:"zodiac-lottery", page:"/selftest", ip:"selftest", visitor_id:"selftest",
        session_id:"selftest", device:"测试", os:"-", browser:"-",
        duration:0, did_draw:false, referrer:"自检"
      })
    });
    const t = await r.text();
    if (r.ok){
      const rows = JSON.parse(t);
      recId = rows && rows[0] && rows[0].id;
      set(d, true, "写入成功，记录 id=" + recId, r.status);
      return true;
    }
    set(d, false, t.slice(0, 120), r.status);
    return false;
  }catch(e){ set(d, false, e.message); return false; }
}

async function test4(){
  const d = row("④ 回写停留时长");
  if (!recId){ set(d, false, "跳过：没有可更新的记录"); return false; }
  try{
    const r = await fetch(URL_ + "/rest/v1/visits?id=eq." + recId, {
      method:"PATCH", headers:H,
      body: JSON.stringify({duration: 12, left_at: new Date().toISOString()})
    });
    if (r.ok){ set(d, true, "时长回写正常", r.status); return true; }
    set(d, false, "更新失败 " + r.status); return false;
  }catch(e){ set(d, false, e.message); return false; }
}

async function test5(){
  const d = row("⑤ 读取统计（看板数据源）");
  try{
    const r = await fetch(URL_ + "/rest/v1/visits?select=id,ip,duration&order=entered_at.desc&limit=5", {headers:{apikey:KEY}});
    if (r.ok){
      const rows = await r.json();
      set(d, true, "可读，最近 " + rows.length + " 条", rows.length);
      return true;
    }
    set(d, false, "读不到，检查 RLS select 策略", r.status);
    return false;
  }catch(e){ set(d, false, e.message); return false; }
}

(async () => {
  if (await test1()){
    if (await test2()){
      await test3();
      await test4();
      await test5();
    }
  }
})();
</script>
</body>
</html>
