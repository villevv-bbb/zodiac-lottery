<style>
  :root{
    --wood1:#c8873f; --wood2:#a8672a; --wood3:#8a4f1d; --wood4:#6d3c12;
    --paper:#f6e7c8; --paper2:#e8d3a9;
    --gold1:#ffe9a8; --gold2:#e8b93f; --gold3:#b8842a; --gold4:#8a5f18;
    --ink:#3b1f0d;
    --red:#a81f1a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    background:#4d0a08;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;position:relative;
  }

  /* ===== 背景氛围层 ===== */
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  /* 1. 主光晕（呼吸） */
  #bg .glow{
    position:absolute;left:50%;top:34%;width:150vmax;height:150vmax;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,
        rgba(255,196,90,.30) 0%,
        rgba(214,96,40,.20) 22%,
        rgba(150,26,18,.12) 42%,
        transparent 66%);
    animation:glowBreath 7s ease-in-out infinite;
  }
  @keyframes glowBreath{
    0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(1);}
    50%{opacity:1;transform:translate(-50%,-50%) scale(1.09);}
  }
  /* 2. 顶部聚光 */
  #bg .spot{
    position:absolute;left:50%;top:-30%;width:120vw;height:110vh;
    transform:translateX(-50%);
    background:conic-gradient(from 170deg at 50% 0%,
        transparent 0deg, rgba(255,220,150,.10) 14deg,
        rgba(255,235,190,.20) 20deg, rgba(255,220,150,.10) 26deg, transparent 40deg);
    filter:blur(6px);
    animation:spotSway 9s ease-in-out infinite;
  }
  @keyframes spotSway{
    0%,100%{transform:translateX(-50%) rotate(-3deg);opacity:.85;}
    50%{transform:translateX(-50%) rotate(3deg);opacity:1;}
  }
  /* 3. 回纹底纹 */
  #bg .pattern{
    position:absolute;inset:0;opacity:.055;
    background-image:
      repeating-linear-gradient(45deg, #ffe0a0 0 2px, transparent 2px 26px),
      repeating-linear-gradient(-45deg, #ffe0a0 0 2px, transparent 2px 26px);
    background-size:52px 52px;
    mask-image:radial-gradient(ellipse at 50% 45%, #000 20%, transparent 78%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 45%, #000 20%, transparent 78%);
  }
  /* 4. 暗角 */
  #bg .vignette{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 46%,
        transparent 34%, rgba(50,4,2,.35) 72%, rgba(28,2,1,.78) 100%);
  }
  /* 5. 金尘 */
  #dust{position:absolute;inset:0;}
  .mote{
    position:absolute;border-radius:50%;
    background:#ffe2a0;
    box-shadow:0 0 6px 2px rgba(255,205,120,.55);
    animation:float linear infinite;
    will-change:transform,opacity;
  }
  @keyframes float{
    0%{transform:translate3d(0,0,0) scale(.6);opacity:0;}
    12%{opacity:.9;}
    80%{opacity:.7;}
    100%{transform:translate3d(var(--dx),-118vh,0) scale(1.1);opacity:0;}
  }
  /* 6. 云气 */
  #bg .cloud{
    position:absolute;width:90vw;height:44vh;border-radius:50%;
    background:radial-gradient(ellipse, rgba(255,150,90,.16), transparent 70%);
    filter:blur(28px);
  }
  #bg .c1{left:-28vw;bottom:-8vh;animation:drift 22s ease-in-out infinite;}
  #bg .c2{right:-30vw;bottom:6vh;animation:drift 28s ease-in-out infinite reverse;}
  @keyframes drift{
    0%,100%{transform:translate3d(0,0,0) scale(1);}
    50%{transform:translate3d(6vw,-4vh,0) scale(1.12);}
  }

  #app{
    position:relative;z-index:2;width:min(94vw,430px);height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:8px 0 16px;
  }

  /* ========= 签筒 ========= */
  #tubeWrap{
    position:relative;
    width:min(64vw,220px);
    height:min(52vh,330px);
    display:flex;align-items:flex-end;justify-content:center;
    transition:transform .08s linear;
    will-change:transform;
  }
  @keyframes tubeFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-7px);}
  }
  /* 台面光池 + 倒影 */
  #tubeWrap::before{
    content:"";position:absolute;left:50%;bottom:-26px;
    width:150%;height:52px;transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 40%,
        rgba(255,190,110,.36) 0%, rgba(255,140,60,.14) 42%, transparent 72%);
    filter:blur(4px);z-index:-1;
    animation:poolBreath 4s ease-in-out infinite;
  }
  @keyframes poolBreath{0%,100%{opacity:.75;}50%{opacity:1;}}
  #tubeWrap::after{
    content:"";position:absolute;left:50%;bottom:-14px;
    width:88%;height:40px;transform:translateX(-50%) scaleY(.4);
    background:linear-gradient(180deg, rgba(40,10,3,.55), transparent 80%);
    border-radius:50%;filter:blur(7px);z-index:-2;
  }
  /* 筒身：圆柱木质 */
  #tube{
    position:relative;width:100%;height:100%;
    border-radius:12px 12px 18px 18px;
    background:
      /* 竖向木纹 */
      repeating-linear-gradient(90deg,
        rgba(255,255,255,.07) 0 1px, transparent 1px 9px),
      linear-gradient(100deg,#b97a34 0%,#d1934a 18%,#c07f36 40%,#9d6224 68%,#7d4a17 100%);
    box-shadow:
      inset -18px 0 30px rgba(60,30,5,.45),
      inset 18px 0 26px rgba(255,220,150,.18),
      inset 0 -22px 30px rgba(50,25,5,.4),
      0 26px 44px rgba(0,0,0,.45);
    overflow:hidden;
    animation:tubeFloat 5.2s ease-in-out infinite;
  }
  /* 高光扫过 */
  #tube .sheen{
    position:absolute;top:-30%;bottom:-30%;width:44%;left:-60%;
    background:linear-gradient(100deg,
        transparent 0%, rgba(255,245,215,.34) 42%,
        rgba(255,255,245,.60) 50%, rgba(255,245,215,.30) 58%, transparent 100%);
    transform:skewX(-14deg);
    filter:blur(3px);
    animation:sheenMove 6.5s ease-in-out infinite;
    z-index:3;pointer-events:none;mix-blend-mode:screen;
  }
  @keyframes sheenMove{
    0%{left:-70%;opacity:0;}
    18%{opacity:1;}
    55%{left:120%;opacity:.9;}
    70%,100%{left:120%;opacity:0;}
  }
  /* 左右边缘暗边，加强圆柱感 */
  #tube .edge{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    border-radius:inherit;
    background:linear-gradient(90deg,
        rgba(50,22,3,.55) 0%, transparent 12%,
        transparent 84%, rgba(45,20,3,.62) 100%);
  }

  /* 顶部筒口（椭圆） */
  #mouth{
    position:absolute;top:-14px;left:-3%;width:106%;height:34px;
    border-radius:50%;
    background:radial-gradient(ellipse at 50% 42%, #2a1103 0%, #45200a 52%, #6b3a14 88%, #8a4f1d 100%);
    box-shadow:inset 0 7px 12px rgba(0,0,0,.75), 0 3px 8px rgba(0,0,0,.4);
    z-index:5;
  }
  #mouth::after{
    content:"";position:absolute;inset:5px 10px;border-radius:50%;
    border:2px solid rgba(255,215,130,.35);
  }
  /* 筒身包边 */
  #tube::after{
    content:"";position:absolute;left:4%;right:4%;bottom:6%;height:16%;
    border-radius:6px;
    background:linear-gradient(180deg,rgba(255,220,140,.35),rgba(120,70,20,.35));
    border-top:2px solid rgba(255,225,150,.45);
    border-bottom:2px solid rgba(90,50,10,.5);
  }
  /* 竖排文字 */
  #label{
    position:absolute;inset:0;z-index:4;
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
    align-content:center;
    width:76%;margin:0 auto;left:0;right:0;
    gap:.06em .1em;padding-bottom:10%;
  }
  #label .ch{
    width:44%;
    display:flex;align-items:center;justify-content:center;
    font-family:"Songti SC","STSong","SimSun",serif;
    font-size:clamp(26px,8vw,36px);font-weight:900;line-height:1.1;
    color:#ffe9a8;letter-spacing:0;
    text-shadow:
      0 2px 0 #b8842a,
      0 3px 0 #8a5f18,
      0 4px 6px rgba(0,0,0,.55);
  }
  /* 字面金色渐变 + 微光流动 */
  #label .ch > i{
    font-style:normal;
    background:linear-gradient(175deg,#fff8dd 0%,#ffe9a8 26%,#f0c862 52%,#ffeec0 66%,#d9a83f 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 0 #9a6a1c) drop-shadow(0 6px 10px rgba(0,0,0,.5));
    animation:goldFlow 5s ease-in-out infinite;
  }
  @keyframes goldFlow{0%,100%{filter:drop-shadow(0 2px 0 #9a6a1c) drop-shadow(0 6px 10px rgba(0,0,0,.5));}
                     50%{filter:drop-shadow(0 2px 0 #9a6a1c) drop-shadow(0 6px 14px rgba(255,200,100,.45));}}

  /* 筒里的签（露出一截） */
  #sticksInTube{
    position:absolute;top:-56px;left:12%;right:12%;height:70px;z-index:3;
    display:flex;justify-content:center;align-items:flex-end;gap:3px;
    pointer-events:none;
  }
  .stickIn{
    width:9px;border-radius:4px 4px 0 0;
    background:linear-gradient(180deg,#fdf0cf,#e6c489 60%,#c99a4e);
    box-shadow:0 1px 3px rgba(0,0,0,.3), inset -2px 0 0 rgba(140,90,30,.35);
    transform-origin:bottom center;
  }

  /* ========= 抽出的那根签 ========= */
  #drawnStick{
    position:absolute;z-index:20;
    left:50%;top:50%;
    width:min(40vw,138px);
    aspect-ratio:1/2.35;
    transform:translate(-50%,-56%) scale(.2) rotate(-8deg);
    opacity:0;pointer-events:none;
    transition:none;
  }
  #drawnStick.show{
    opacity:1;
  }
  .stickFace{
    position:absolute;inset:0;
    border-radius:10px;
    background:
      linear-gradient(100deg,#fffdf3 0%,#f7ecd2 30%,#efe0bd 62%,#dcc79c 100%);
    box-shadow:
      0 18px 40px rgba(0,0,0,.5),
      inset 0 0 0 2px rgba(190,150,90,.45),
      inset 0 0 22px rgba(190,160,110,.35);
    overflow:hidden;
    display:flex;flex-direction:column;align-items:center;
    padding:9% 8% 8%;
  }
  /* 签头红漆 */
  .stickTop{
    position:absolute;top:0;left:0;right:0;height:9%;
    background:linear-gradient(180deg,#c0392b,#96261c);
    border-radius:10px 10px 0 0;
    box-shadow:inset 0 -2px 3px rgba(0,0,0,.25);
  }
  .stickVert{
    margin-top:15%;
    writing-mode:vertical-rl;
    font-family:"Songti SC","STSong","SimSun",serif;
    font-size:clamp(22px,7vw,30px);font-weight:900;
    color:var(--red);letter-spacing:.14em;
    text-shadow:0 1px 0 rgba(255,255,255,.7);
  }
  .stickNum{
    margin-top:auto;
    font-family:"Songti SC","STSong",serif;
    font-size:clamp(15px,4.6vw,19px);font-weight:900;
    color:#8a5f18;letter-spacing:.08em;
  }
  .stickSeal{
    position:absolute;right:11%;bottom:9%;
    width:22%;aspect-ratio:1;border-radius:4px;
    background:#b7271f;color:#fff2d8;
    display:flex;align-items:center;justify-content:center;
    font-family:"Songti SC",serif;font-size:clamp(9px,2.8vw,12px);
    font-weight:700;line-height:1.05;text-align:center;
    box-shadow:0 2px 4px rgba(0,0,0,.3);
    transform:rotate(-6deg);
  }
  /* 抽出动画 */
  @keyframes pullOut{
    0%{transform:translate(-50%,-46%) scale(.55) rotate(-12deg);opacity:0;}
    35%{transform:translate(-50%,-88%) scale(.92) rotate(6deg);opacity:1;}
    55%{transform:translate(-50%,-96%) scale(1.02) rotate(-3deg);}
    72%{transform:translate(-50%,-76%) scale(1) rotate(2deg);}
    100%{transform:translate(-50%,-56%) scale(1) rotate(0deg);opacity:1;}
  }
  #drawnStick.anim{animation:pullOut .82s cubic-bezier(.3,1.3,.5,1) forwards;}

  /* 签后光轮 */
  #halo{
    position:absolute;left:50%;top:50%;z-index:19;
    width:min(78vw,300px);aspect-ratio:1;
    transform:translate(-50%,-52%) scale(.5);
    border-radius:50%;
    background:radial-gradient(circle,
        rgba(255,246,214,.55) 0%,
        rgba(255,206,110,.32) 26%,
        rgba(255,150,60,.12) 48%,
        transparent 70%);
    opacity:0;pointer-events:none;
    filter:blur(2px);
  }
  #halo.on{animation:haloPop 1.15s ease-out forwards;}
  @keyframes haloPop{
    0%{opacity:0;transform:translate(-50%,-52%) scale(.35);}
    28%{opacity:1;transform:translate(-50%,-52%) scale(1.05);}
    60%{opacity:.55;transform:translate(-50%,-52%) scale(1.15);}
    100%{opacity:.26;transform:translate(-50%,-52%) scale(1.28);}
  }
  /* 金色光线 */
  #rays{
    position:absolute;left:50%;top:50%;z-index:18;
    width:min(96vw,380px);aspect-ratio:1;
    transform:translate(-50%,-52%);
    opacity:0;pointer-events:none;
    background:conic-gradient(from 0deg,
      rgba(255,225,150,0) 0deg, rgba(255,225,150,.30) 3deg, rgba(255,225,150,0) 7deg,
      rgba(255,225,150,0) 40deg, rgba(255,225,150,.22) 43deg, rgba(255,225,150,0) 47deg,
      rgba(255,225,150,0) 82deg, rgba(255,225,150,.26) 85deg, rgba(255,225,150,0) 89deg,
      rgba(255,225,150,0) 130deg, rgba(255,225,150,.20) 133deg, rgba(255,225,150,0) 137deg,
      rgba(255,225,150,0) 176deg, rgba(255,225,150,.28) 179deg, rgba(255,225,150,0) 183deg,
      rgba(255,225,150,0) 222deg, rgba(255,225,150,.22) 225deg, rgba(255,225,150,0) 229deg,
      rgba(255,225,150,0) 268deg, rgba(255,225,150,.26) 271deg, rgba(255,225,150,0) 275deg,
      rgba(255,225,150,0) 314deg, rgba(255,225,150,.20) 317deg, rgba(255,225,150,0) 321deg,
      rgba(255,225,150,0) 360deg);
    mask-image:radial-gradient(circle, #000 10%, transparent 62%);
    -webkit-mask-image:radial-gradient(circle, #000 10%, transparent 62%);
  }
  #rays.on{animation:raySpin 2.2s ease-out forwards;}
  @keyframes raySpin{
    0%{opacity:0;transform:translate(-50%,-52%) rotate(0deg) scale(.6);}
    22%{opacity:.95;}
    100%{opacity:0;transform:translate(-50%,-52%) rotate(46deg) scale(1.15);}
  }
  /* 光爆圆环 */
  .ring{
    position:absolute;left:50%;top:50%;z-index:19;
    width:60px;height:60px;border-radius:50%;
    border:2px solid rgba(255,236,180,.85);
    transform:translate(-50%,-50%) scale(.3);
    pointer-events:none;
    animation:ringOut .85s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes ringOut{
    0%{opacity:.95;transform:translate(-50%,-50%) scale(.3);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(5.2);}
  }
  /* 签身微微发光 */
  #drawnStick.show .stickFace{
    box-shadow:
      0 18px 40px rgba(0,0,0,.5),
      0 0 36px rgba(255,214,130,.34),
      inset 0 0 0 2px rgba(190,150,90,.45),
      inset 0 0 22px rgba(190,160,110,.35);
  }

  /* ========= 文字区 ========= */
  #hint{
    position:absolute;bottom:9%;left:0;right:0;text-align:center;
    font-size:14px;color:#ffdca8;letter-spacing:2px;z-index:8;
    text-shadow:0 2px 6px rgba(0,0,0,.5);
    animation:breathe 2s ease-in-out infinite;
  }
  #hint .dot{
    display:inline-block;width:5px;height:5px;border-radius:50%;
    background:#ffd76e;margin:0 8px 2px;vertical-align:middle;
    box-shadow:0 0 8px 2px rgba(255,200,100,.7);
    animation:dotPulse 1.6s ease-in-out infinite;
  }
  @keyframes dotPulse{0%,100%{transform:scale(.7);opacity:.5;}50%{transform:scale(1.2);opacity:1;}}
  @keyframes breathe{0%,100%{opacity:.62}50%{opacity:1}}

  #title{
    position:absolute;top:3.5%;left:0;right:0;text-align:center;z-index:8;
    font-family:"Songti SC","STSong",serif;
    font-size:clamp(24px,7vw,32px);font-weight:900;letter-spacing:.3em;
    color:#ffe9a8;text-indent:.3em;
    text-shadow:0 3px 0 #7a3d0e, 0 6px 16px rgba(0,0,0,.45);
  }
  #title span{
    background:linear-gradient(178deg,#fff9e2 0%,#ffe9a8 30%,#f2ca66 55%,#fff2cd 70%,#d9a83f 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 0 #7a3d0e) drop-shadow(0 5px 14px rgba(0,0,0,.5));
  }
  /* 标题下的金线装饰 */
  #title::after{
    content:"";display:block;margin:8px auto 0;width:56%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,225,150,.75),transparent);
    box-shadow:0 0 8px rgba(255,214,120,.6);
  }
  /* 呼吸光晕衬在标题后 */
  #title::before{
    content:"";position:absolute;left:50%;top:50%;width:210px;height:80px;
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse, rgba(255,190,90,.22), transparent 70%);
    filter:blur(10px);z-index:-1;
    animation:glowBreath 5s ease-in-out infinite;
  }

  /* 结果说明 */
  #reading{
    position:absolute;bottom:5.5%;left:0;right:0;z-index:8;
    text-align:center;opacity:0;transform:translateY(10px);
    transition:opacity .3s, transform .3s;
  }
  #reading.show{opacity:1;transform:translateY(0);}
  #reading .rk{
    font-family:"Songti SC",serif;font-size:clamp(16px,4.6vw,20px);
    font-weight:900;color:#ffd76e;letter-spacing:.2em;text-indent:.2em;
    text-shadow:0 2px 8px rgba(0,0,0,.6);
  }
  #reading .rd{
    margin-top:6px;font-size:13px;color:#ffd9b0;opacity:.85;
    letter-spacing:.05em;padding:0 24px;line-height:1.6;
    text-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  #reading .line{
    width:0;height:1px;margin:9px auto 0;
    background:linear-gradient(90deg,transparent,rgba(255,220,140,.7),transparent);
    transition:width .6s ease .1s;
  }
  #reading.show .line{width:64%;}
  #btnRow{
    margin-top:12px;display:flex;gap:10px;justify-content:center;align-items:center;
  }
  #again,#invite{
    border:none;cursor:pointer;font-family:inherit;
    padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:700;
    position:relative;overflow:hidden;
  }
  #again{
    color:#8a1410;background:linear-gradient(180deg,#ffe9a8,#e8b93f);
    box-shadow:0 6px 16px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.6);
  }
  #invite{
    color:#ffe9a8;background:linear-gradient(180deg,#c0392b,#8d1712);
    box-shadow:0 6px 16px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,190,150,.35),
               inset 0 0 0 1px rgba(255,210,140,.35);
  }
  #again::after,#invite::after{
    content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);
    transform:skewX(-18deg);
    animation:btnShine 3.2s ease-in-out infinite;
  }
  #invite::after{animation-delay:1.1s;background:linear-gradient(100deg,transparent,rgba(255,235,190,.55),transparent);}
  @keyframes btnShine{0%,55%{left:-60%;}90%,100%{left:130%;}}
  #again:active,#invite:active{transform:scale(.96);}

<script>

/* 中文数字（签号用） */
const CN = ["零","一","二","三","四","五","六","七","八","九"];
function cnNum(n){
  if (n < 10) return "第" + CN[n] + "签";
  const t = Math.floor(n/10), u = n%10;
  let s = (t === 1 ? "十" : CN[t] + "十");
  if (u) s += CN[u];
  return "第" + s + "签";
}

const tubeWrap = document.getElementById("tubeWrap");
const drawn    = document.getElementById("drawnStick");
const stickText= document.getElementById("stickText");
const stickNum = document.getElementById("stickNum");
const reading  = document.getElementById("reading");
const rkText   = document.getElementById("rkText");
const rdText   = document.getElementById("rdText");
const hint     = document.getElementById("hint");
const again    = document.getElementById("again");

let busy = false;
let gotSign = false;

/* 加密级随机 */
function randInt(n){
  if (window.crypto && crypto.getRandomValues){
    const a = new Uint32Array(1);
    const limit = Math.floor(0xFFFFFFFF / n) * n;
    do { crypto.getRandomValues(a); } while (a[0] >= limit);
    return a[0] % n;
  }
  return Math.floor(Math.random() * n);
}

/* 筒里插着的签（随机高低） */
(function buildSticks(){
  const box = document.getElementById("sticksInTube");

    const d = document.createElement("div");

    d.style.opacity = 0.9 - i*0.02;

})();

/* 金尘粒子 */
(function buildDust(){
  const layer = document.getElementById("dust");

    const m = document.createElement("div");

  }
})();

/* 摇一摇检测 */
let lastX = null, lastY = null, lastZ = null, lastShake = 0;
function onMotion(e){
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a || a.x == null) return;
  const now = Date.now();
  if (now - lastShake < 900) { lastX=a.x; lastY=a.y; lastZ=a.z; return; }
  if (lastX === null){ lastX=a.x; lastY=a.y; lastZ=a.z; return; }
  const dx = Math.abs(a.x - lastX), dy = Math.abs(a.y - lastY), dz = Math.abs(a.z - lastZ);
  const speed = dx + dy + dz;
  lastX=a.x; lastY=a.y; lastZ=a.z;
  if (speed > 26){
    lastShake = now;
    draw();
  }
}
function enableMotion(){
  if (window.DeviceMotionEvent){
    if (typeof DeviceMotionEvent.requestPermission === "function"){
      DeviceMotionEvent.requestPermission()
        .then(s => { if (s === "granted") window.addEventListener("devicemotion", onMotion); })
        .catch(() => {});
    } else {
      window.addEventListener("devicemotion", onMotion);
    }
  }
}
enableMotion();

/* ============================================================
   分享海报生成（Canvas）
   ============================================================ */
const SITE_URL = "https://villevv-bbb.github.io/zodiac-lottery/lottery.html";
const SHEET_URL = "https://villevv-bbb.github.io/zodiac-lottery/share-lottery.png";

const SERIF = '"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif';
const SANS  = '-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';

const sheetEl  = document.getElementById("sheet");
const pCanvas  = document.getElementById("posterCanvas");
const pBusy    = document.getElementById("posterBusy");
let lastSign = null, lastNum = 0, posterBlob = null, posterDataUrl = null;

/* 圆角矩形 */
function rr(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
/* 竖排文字 */
function vText(ctx, text, cx, top, size, color, font, gap){
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `900 ${size}px ${font}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const step = (gap == null ? size * 1.16 : gap);
  for (let i = 0; i < text.length; i++){
    ctx.fillText(text[i], cx, top + i * step + size / 2);
  }
  ctx.restore();
}
/* 金色渐变字 */
function goldText(ctx, text, x, y, size, font){
  const g = ctx.createLinearGradient(0, y - size, 0, y + size * 0.4);
  g.addColorStop(0, "#fff8dd");
  g.addColorStop(0.32, "#ffe9a8");
  g.addColorStop(0.62, "#f0c862");
  g.addColorStop(0.82, "#fff2cd");
  g.addColorStop(1, "#d9a83f");
  ctx.fillStyle = g;
  ctx.font = `900 ${size}px ${font}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, x, y);
}

/* 画签筒 */
function drawTube(ctx, cx, top, w, h){
  const x = cx - w/2;
  // 阴影
  ctx.save();
  const sh = ctx.createRadialGradient(cx, top + h + 8, 6, cx, top + h + 8, w * 0.95);
  sh.addColorStop(0, "rgba(0,0,0,.55)");
  sh.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = sh;
  ctx.beginPath();
  ctx.ellipse(cx, top + h + 6, w * 0.78, 20, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 筒身
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0,   "#7d4a17");
  g.addColorStop(0.10,"#b97a34");
  g.addColorStop(0.24,"#d1934a");
  g.addColorStop(0.46,"#c07f36");
  g.addColorStop(0.74,"#9d6224");
  g.addColorStop(1,   "#6d3c12");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x, top);
  ctx.lineTo(x, top + h - 16);
  ctx.quadraticCurveTo(x, top + h + 4, x + 18, top + h + 8);
  ctx.lineTo(x + w - 18, top + h + 8);
  ctx.quadraticCurveTo(x + w, top + h + 4, x + w, top + h - 16);
  ctx.lineTo(x + w, top);
  ctx.closePath();
  ctx.fill();

  // 木纹
  ctx.save();
  ctx.clip();
  ctx.globalAlpha = 0.10;
  ctx.strokeStyle = "#3a1c05";
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 22; i++){
    const lx = x + 6 + i * (w - 12) / 21;
    ctx.beginPath();
    ctx.moveTo(lx, top);
    ctx.bezierCurveTo(lx + 3, top + h*0.3, lx - 3, top + h*0.65, lx + 1, top + h);
    ctx.stroke();
  }
  ctx.restore();

  // 边缘暗影
  ctx.save();
  const eg = ctx.createLinearGradient(x, 0, x + w, 0);
  eg.addColorStop(0, "rgba(45,18,2,.62)");
  eg.addColorStop(0.14, "rgba(45,18,2,0)");
  eg.addColorStop(0.86, "rgba(40,16,2,0)");
  eg.addColorStop(1, "rgba(38,14,2,.66)");
  ctx.fillStyle = eg;
  ctx.fillRect(x, top, w, h + 10);
  ctx.restore();

  // 底部包边
  ctx.save();
  const bg = ctx.createLinearGradient(0, top + h - 52, 0, top + h + 6);
  bg.addColorStop(0, "rgba(255,220,140,.30)");
  bg.addColorStop(1, "rgba(110,62,16,.42)");
  ctx.fillStyle = bg;
  ctx.fillRect(x + 6, top + h - 50, w - 12, 56);
  ctx.restore();

  // 筒口（椭圆）
  ctx.save();
  const mg = ctx.createRadialGradient(cx, top + 2, 4, cx, top + 2, w * 0.56);
  mg.addColorStop(0, "#1e0a02");
  mg.addColorStop(0.55, "#45200a");
  mg.addColorStop(0.9, "#6b3a14");
  mg.addColorStop(1, "#8a4f1d");
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.ellipse(cx, top, w * 0.53, 20, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,215,130,.42)";
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.ellipse(cx, top, w * 0.47, 15, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // 筒上的字：财 密 / 富 码（2×2，整体偏左，避让右侧的签）
  const fs = Math.round(w * 0.26);
  const lx1 = cx - fs * 1.20, lx2 = cx - fs * 0.08;
  const ly1 = top + h * 0.30, ly2 = top + h * 0.30 + fs * 1.22;
  [["财", lx1, ly1], ["密", lx2, ly1], ["富", lx1, ly2], ["码", lx2, ly2]].forEach(([c, px, py]) => {
    ctx.save();
    ctx.font = `900 ${fs}px ${SERIF}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,.55)";
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 4;
    const cg = ctx.createLinearGradient(0, py - fs/2, 0, py + fs/2);
    cg.addColorStop(0, "#fff8dd");
    cg.addColorStop(0.4, "#ffe9a8");
    cg.addColorStop(0.75, "#eec25c");
    cg.addColorStop(1, "#c99a2e");
    ctx.fillStyle = cg;
    ctx.fillText(c, px, py);
    ctx.restore();
  });
}

/* 画一根签（返回签的绘制区域） */
function drawStick(ctx, cx, top, w, h, rank, numText, angle){
  const pivX = cx + w * 0.66, pivY = top + h * 0.44;
  ctx.save();
  ctx.translate(pivX, pivY);
  ctx.rotate(angle);
  ctx.translate(-pivX, -pivY);

  const x = cx + w * 0.26, y = top + h * 0.02;
  const sw = w * 0.72, shh = h * 0.90;

  // 投影
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.5)";
  ctx.shadowBlur = 26;
  ctx.shadowOffsetX = 6;
  ctx.shadowOffsetY = 14;
  ctx.fillStyle = "#f7ecd2";
  rr(ctx, x, y, sw, shh, 14);
  ctx.fill();
  ctx.restore();

  // 签面
  const sg = ctx.createLinearGradient(x, y, x + sw, y + shh);
  sg.addColorStop(0, "#fffdf3");
  sg.addColorStop(0.34, "#f7ecd2");
  sg.addColorStop(0.68, "#efe0bd");
  sg.addColorStop(1, "#dcc79c");
  ctx.fillStyle = sg;
  rr(ctx, x, y, sw, shh, 14);
  ctx.fill();
  ctx.strokeStyle = "rgba(190,150,90,.55)";
  ctx.lineWidth = 3;
  rr(ctx, x + 1.5, y + 1.5, sw - 3, shh - 3, 13);
  ctx.stroke();

  // 红漆签头
  ctx.save();
  rr(ctx, x, y, sw, shh, 14);
  ctx.clip();
  const rg = ctx.createLinearGradient(0, y, 0, y + shh * 0.09);
  rg.addColorStop(0, "#c0392b");
  rg.addColorStop(1, "#96261c");
  ctx.fillStyle = rg;
  ctx.fillRect(x, y, sw, shh * 0.09);
  ctx.restore();

  // 签文竖排（根据字数自适应，确保不超出签面、不压签号和印章）
  const chars = rank.length;
  const vfs = Math.round(Math.min(sw * 0.26, shh * 0.52 / chars));
  const vStep = vfs * 1.06;
  const vTop = y + shh * 0.10 + (shh * 0.58 - (chars - 1) * vStep - vfs) / 2;
  vText(ctx, rank, x + sw * 0.5, vTop, vfs, "#a81f1a", SERIF, vStep);

  // 签号
  ctx.save();
  ctx.font = `900 ${Math.round(sw * 0.14)}px ${SERIF}`;
  ctx.fillStyle = "#8a5f18";
  ctx.textAlign = "center";
  ctx.fillText(numText, x + sw * 0.5, y + shh * 0.885);
  ctx.restore();

  // 印章
  const sealS = sw * 0.19;
  ctx.save();
  ctx.translate(x + sw * 0.80, y + shh * 0.74);
  ctx.rotate(-6 * Math.PI / 180);
  ctx.fillStyle = "#b7271f";
  rr(ctx, -sealS/2, -sealS/2, sealS, sealS, 5);
  ctx.fill();
  ctx.fillStyle = "#fff2d8";
  ctx.font = `700 ${Math.round(sealS * 0.42)}px ${SERIF}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("吉", 0, -sealS * 0.19);
  ctx.fillText("祥", 0,  sealS * 0.21);
  ctx.restore();

  ctx.restore();
}

/* 金尘 */
function drawDust(ctx, W, H, n){
  for (let i = 0; i < n; i++){
    const x = Math.random() * W, y = Math.random() * H;
    const r = 0.8 + Math.random() * 2.6;
    const a = 0.10 + Math.random() * 0.55;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = "#ffe2a0";
    ctx.shadowColor = "rgba(255,205,120,.9)";
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/* ============================================================
   版式工具：统一测量与对齐（所有文字都按"实测包围盒"垂直居中）
   ============================================================ */
function mctx(){ return pCanvas.getContext("2d"); }

/* 设置字体并返回度量 */
function setFont(ctx, weight, size, family){
  ctx.font = `${weight} ${size}px ${family}`;
  return ctx.measureText("汉");
}

/* 以基线盒子垂直居中绘制单行文字 */
function textMid(ctx, str, cx, cy, size, color, weight, family, opt){
  opt = opt || {};
  ctx.save();
  ctx.font = `${weight} ${size}px ${family}`;
  ctx.fillStyle = color;
  ctx.textAlign = opt.align || "center";
  ctx.textBaseline = "alphabetic";
  const m = ctx.measureText(str);
  const asc = (m.actualBoundingBoxAscent != null) ? m.actualBoundingBoxAscent : size * 0.78;
  const desc = (m.actualBoundingBoxDescent != null) ? m.actualBoundingBoxDescent : size * 0.22;
  const baseY = cy + (asc - desc) / 2;
  if (opt.shadow){
    ctx.shadowColor = opt.shadow;
    ctx.shadowBlur = opt.blur || 10;
    ctx.shadowOffsetY = opt.offY || 0;
  }
  ctx.fillText(str, cx, baseY);
  ctx.restore();
  return {asc, desc, w: m.width};
}

/* 金色渐变文字（垂直居中） */
function goldMid(ctx, str, cx, cy, size, family, opt){
  opt = opt || {};
  ctx.save();
  ctx.font = `900 ${size}px ${family}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  const m = ctx.measureText(str);
  const asc = (m.actualBoundingBoxAscent != null) ? m.actualBoundingBoxAscent : size * 0.78;
  const desc = (m.actualBoundingBoxDescent != null) ? m.actualBoundingBoxDescent : size * 0.22;
  const baseY = cy + (asc - desc) / 2;
  const g = ctx.createLinearGradient(0, cy - asc, 0, cy + desc);
  g.addColorStop(0, "#fff9e6");
  g.addColorStop(0.34, "#ffe9a8");
  g.addColorStop(0.60, "#f0c862");
  g.addColorStop(0.80, "#fff2cd");
  g.addColorStop(1, "#d9a83f");
  ctx.fillStyle = g;
  ctx.shadowColor = opt.shadow || "rgba(70,20,0,.55)";
  ctx.shadowBlur = opt.blur || 14;
  ctx.shadowOffsetY = opt.offY || 5;
  ctx.fillText(str, cx, baseY);
  ctx.restore();
  return {asc, desc, w: m.width};
}

/* 多行文字按字符换行（返回行数组），保证不超宽 */
function wrapCJK(ctx, text, maxW){
  const lines = [];
  let line = "";
  for (const ch of text){
    if (ch === "\n"){ lines.push(line); line = ""; continue; }
    if (ctx.measureText(line + ch).width > maxW && line){
      lines.push(line); line = ch;
    } else line += ch;
  }
  if (line) lines.push(line);
  return lines;
}

/* 多行文本块居中绘制：返回实际占用高度 */
function textBlock(ctx, text, cx, top, size, color, weight, family, maxW, lineGap, opt){
  opt = opt || {};
  ctx.save();
  ctx.font = `${weight} ${size}px ${family}`;
  const lines = wrapCJK(ctx, text, maxW);
  const lh = size * (lineGap || 1.62);
  lines.forEach((t, i) => {
    const cy = top + i * lh + size * 0.5 + size * 0.14;
    textMid(ctx, t, cx, cy, size, color, weight, family, {shadow: opt.shadow, blur: opt.blur, offY: opt.offY});
  });
  ctx.restore();
  return lines.length * lh;
}

/* ===== 绘制整张海报 ===== */
function buildPoster(sign, num){
  const W = 750, H = 1334;
  pCanvas.width = W; pCanvas.height = H;
  const ctx = mctx();
  ctx.clearRect(0, 0, W, H);

  /* ---------- 背景 ---------- */
  const bg = ctx.createRadialGradient(W/2, H*0.30, 40, W/2, H*0.44, H*0.86);
  bg.addColorStop(0,    "#c9352a");
  bg.addColorStop(0.28, "#a81e17");
  bg.addColorStop(0.62, "#82130f");
  bg.addColorStop(1,    "#4a0806");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 中心光晕（签筒背后）
  const gl = ctx.createRadialGradient(W/2, 500, 20, W/2, 500, W*0.66);
  gl.addColorStop(0, "rgba(255,205,120,.32)");
  gl.addColorStop(0.42, "rgba(228,120,55,.15)");
  gl.addColorStop(1, "rgba(150,26,18,0)");
  ctx.fillStyle = gl;
  ctx.fillRect(0, 0, W, H);

  // 回纹暗纹
  ctx.save();
  ctx.globalAlpha = 0.045;
  ctx.strokeStyle = "#ffe0a0";
  ctx.lineWidth = 2;
  for (let d = -H; d < W + H; d += 46){
    ctx.beginPath(); ctx.moveTo(d, 0); ctx.lineTo(d + H, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(d, H); ctx.lineTo(d + H, 0); ctx.stroke();
  }
  ctx.restore();

  drawDust(ctx, W, H, 110);

  // 暗角
  const vg = ctx.createRadialGradient(W/2, H*0.44, H*0.18, W/2, H*0.46, H*0.70);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(0.60, "rgba(40,3,2,.26)");
  vg.addColorStop(1, "rgba(22,1,1,.70)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  /* ---------- 页头 ---------- */
  const HEAD_Y = 108;          // 主标题中心
  goldMid(ctx, "财 富 密 码", W/2, HEAD_Y, 74, SERIF);

  // 标题下金线（对称、居中）
  const lineY = HEAD_Y + 58;
  const lineW = 300;
  const lg = ctx.createLinearGradient(W/2 - lineW/2, 0, W/2 + lineW/2, 0);
  lg.addColorStop(0, "rgba(255,225,150,0)");
  lg.addColorStop(0.5, "rgba(255,232,175,.9)");
  lg.addColorStop(1, "rgba(255,225,150,0)");
  ctx.fillStyle = lg;
  ctx.fillRect(W/2 - lineW/2, lineY, lineW, 2);

  // 副标题（金线下方，等距）
  textMid(ctx, "摇 一 摇 · 抽 一 支 属 于 你 的 签", W/2, lineY + 32, 25,
          "rgba(255,226,184,.90)", 500, SANS, {shadow:"rgba(0,0,0,.45)", blur:8});

  /* ---------- 签筒与签 ---------- */
  const tubeW = 292, tubeH = 330;
  const tubeX = W/2 + 26, tubeTop = 268;
  // 底座光圈
  ctx.save();
  const pool = ctx.createRadialGradient(tubeX, tubeTop + tubeH + 6, 6, tubeX, tubeTop + tubeH + 6, tubeW * 0.9);
  pool.addColorStop(0, "rgba(255,196,110,.30)");
  pool.addColorStop(1, "rgba(255,150,60,0)");
  ctx.fillStyle = pool;
  ctx.beginPath();
  ctx.ellipse(tubeX, tubeTop + tubeH + 6, tubeW * 0.86, 44, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  drawTube(ctx, tubeX, tubeTop, tubeW, tubeH);
  drawStick(ctx, tubeX, tubeTop, tubeW, tubeH, sign.rank, cnNum(num), -0.15);

  /* ---------- 结果区（严格自上而下排布，间距统一） ---------- */
  let y = 700;

  // 1. 签级
  goldMid(ctx, sign.rank, W/2, y, 54, SERIF);
  y += 62;

  // 2. 签号胶囊（自身垂直居中）
  const numStr = cnNum(num);
  ctx.save();
  ctx.font = `900 24px ${SERIF}`;
  const tw = ctx.measureText(numStr).width;
  ctx.restore();
  const pillH = 46, pillW = Math.max(176, tw + 64);
  const pillY = y;
  ctx.save();
  rr(ctx, W/2 - pillW/2, pillY, pillW, pillH, pillH/2);
  ctx.fillStyle = "rgba(255,224,170,.13)";
  ctx.fill();
  ctx.strokeStyle = "rgba(255,214,140,.52)";
  ctx.lineWidth = 1.6;
  rr(ctx, W/2 - pillW/2, pillY, pillW, pillH, pillH/2);
  ctx.stroke();
  ctx.restore();
  textMid(ctx, numStr, W/2, pillY + pillH/2, 24, "#ffd76e", 900, SERIF);
  y = pillY + pillH + 34;

  // 3. 诗句（引号用浅色，诗句金色，整体居中）
  ctx.save();
  ctx.font = `700 34px ${SERIF}`;
  const q1 = "「 ", q2 = " 」";
  const wAll = ctx.measureText(q1 + sign.poem + q2).width;
  let cx = W/2 - wAll/2;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  const put = (t, color) => {
    ctx.font = `700 34px ${SERIF}`;
    ctx.fillStyle = color;
    const m = ctx.measureText(t);
    const asc = (m.actualBoundingBoxAscent != null) ? m.actualBoundingBoxAscent : 26;
    const desc = (m.actualBoundingBoxDescent != null) ? m.actualBoundingBoxDescent : 8;
    ctx.fillText(t, cx, y + (asc - desc) / 2);
    cx += m.width;
  };
  ctx.shadowColor = "rgba(0,0,0,.45)";
  ctx.shadowBlur = 8;
  put(q1, "rgba(255,206,150,.62)");
  ctx.shadowColor = "transparent";
  put(sign.poem, "#ffe8c2");
  ctx.shadowColor = "rgba(0,0,0,.45)";
  put(q2, "rgba(255,206,150,.62)");
  ctx.restore();
  y += 66;

  // 4. 解读（自动换行，行高统一，最多 3 行，超长自动缩小字号）
  let saySize = 23;
  ctx.save();
  ctx.font = `400 ${saySize}px ${SANS}`;
  let lines = wrapCJK(ctx, sign.say, W * 0.76);
  if (lines.length > 3){ saySize = 21; ctx.font = `400 ${saySize}px ${SANS}`; lines = wrapCJK(ctx, sign.say, W * 0.78); }
  ctx.restore();
  const usedH = textBlock(ctx, lines.join(""), W/2, y, saySize,
                          "rgba(255,226,196,.80)", 400, SANS, W * 0.78, 1.66,
                          {shadow:"rgba(0,0,0,.35)", blur:6});
  y += Math.min(usedH, saySize * 1.66 * 3);

  /* ---------- 底部二维码 ---------- */
  const qrSize = 170;
  const qrY = H - 300;
  const qrX = W/2 - qrSize/2;

  // 二维码上方引导语
  textMid(ctx, "长按识别 · 抽你的签", W/2, qrY - 38, 25, "#ffd76e", 900, SANS,
          {shadow:"rgba(0,0,0,.5)", blur:8});

  // 底板
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.45)";
  ctx.shadowBlur = 22;
  ctx.shadowOffsetY = 9;
  ctx.fillStyle = "#f6e7c8";
  rr(ctx, qrX - 13, qrY - 13, qrSize + 26, qrSize + 26, 13);
  ctx.fill();
  ctx.restore();
  ctx.strokeStyle = "rgba(200,160,90,.7)";
  ctx.lineWidth = 2;
  rr(ctx, qrX - 13, qrY - 13, qrSize + 26, qrSize + 26, 13);
  ctx.stroke();

  if (window.__qrImg && window.__qrImg.complete && window.__qrImg.naturalWidth){
    ctx.drawImage(window.__qrImg, qrX, qrY, qrSize, qrSize);
  }

  // 底部邀请语
  textMid(ctx, "看看你手气如何 · 抽到上上签记得回来报喜", W/2, H - 52, 21,
          "rgba(255,214,176,.70)", 500, SANS, {shadow:"rgba(0,0,0,.4)", blur:6});

  /* ---------- 四角金线 ---------- */
  ctx.save();
  ctx.strokeStyle = "rgba(255,220,150,.42)";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  const m = 26, L = 52;
  [[m, m, 1, 1], [W-m, m, -1, 1], [m, H-m, 1, -1], [W-m, H-m, -1, -1]].forEach(([x, yy, sx, sy]) => {
    ctx.beginPath();
    ctx.moveTo(x + sx * L, yy);
    ctx.lineTo(x, yy);
    ctx.lineTo(x, yy + sy * L);
    ctx.stroke();
  });
  ctx.restore();

  posterDataUrl = pCanvas.toDataURL("image/png");
  pCanvas.toBlob(b => { posterBlob = b; }, "image/png");
}

/* 生成二维码图片（使用同域静态二维码图，避免外部依赖） */
function makeQR(text, cb){
  const i2 = new Image();
  i2.crossOrigin = "anonymous";
  i2.onload = () => { window.__qrImg = i2; cb(); };
  i2.onerror = () => { cb(); };
  i2.src = "qr.png";
}

const rays = document.getElementById("rays");

function burst(){
  const r = drawn.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  // 圆环
  for (let i = 0; i < 2; i++){
    const ring = document.createElement("div");
    ring.className = "ring";
    ring.style.left = cx + "px";
    ring.style.top  = cy + "px";
    ring.style.animationDelay = (i * 130) + "ms";
    document.body.appendChild(ring);
    setTimeout(() => ring.remove(), 1100);
  }
  // 光轮 / 光线
  halo.classList.remove("on"); rays.classList.remove("on");
  void halo.offsetWidth;
  halo.classList.add("on"); rays.classList.add("on");
}

function draw(){
  if (busy) return;
  busy = true;

  // 重置上一签
  drawn.classList.remove("show", "anim");
  reading.classList.remove("show");
  hint.style.display = "none";

  // 摇筒
  tubeWrap.classList.add("shaking");

  // 随机结果
  const idx = randInt(SIGNS.length);
  const sign = SIGNS[idx];
  const num = 1 + randInt(49);
  lastSign = sign; lastNum = num;
  if (window.Stats) window.Stats.draw();

  setTimeout(() => {
    tubeWrap.classList.remove("shaking");

    // 设置签上文字
    stickText.textContent = sign.rank;
    stickNum.textContent  = cnNum(num);

    // 抽出
    void drawn.offsetWidth;
    drawn.classList.add("show");
    drawn.classList.add("anim");

    // 特效
    burst();
    confetti();

    setTimeout(() => {
      rkText.textContent = sign.rank + " · " + sign.poem;
      rdText.textContent = sign.say;
      reading.classList.add("show");
      gotSign = true;
      busy = false;
    }, 520);

  }, 820);
}

/* 点击作为降级触发（桌面/无法倾斜传感器时） */
tubeWrap.addEventListener("click", draw);
again.addEventListener("click", draw);
window.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); draw(); }});

/* iOS 13+ 需要用户手势授权 */
tubeWrap.addEventListener("touchend", enableMotion, {once:true});

function confetti(){
  const r = drawn.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const colors = ["#e8b93f","#ffe9a8","#c0392b","#f6e7c8","#d4a03a","#fff6d8"];
  for (let i=0;i<30;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.background = colors[randInt(colors.length)];
    c.style.left = cx+"px"; c.style.top = cy+"px";
    // 一部分做成金色小圆点（金粉）
    if (i % 3 === 0){
      c.style.borderRadius = "50%";
      c.style.width = c.style.height = "5px";
      c.style.boxShadow = "0 0 7px 2px rgba(255,210,120,.75)";
    }
    document.body.appendChild(c);
    const ang = Math.random()*Math.PI*2, d = 60 + Math.random()*160;
    c.animate([
      {transform:"translate(-50%,-50%) rotate(0) scale(1)", opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(ang)*d}px), calc(-50% + ${Math.sin(ang)*d + 80}px)) rotate(${randInt(360)}deg) scale(.35)`, opacity:0}
    ], {duration:800+Math.random()*600, easing:"cubic-bezier(.2,.6,.4,1)"})
     .onfinish = () => c.remove();
  }
}

let ttm;
function toast(m){
  const t = document.getElementById("toast");
  t.textContent = m; t.classList.add("show");
  clearTimeout(ttm); ttm = setTimeout(() => t.classList.remove("show"), 2000);
}

/* 首次提示 */
setTimeout(() => {
  if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission !== "function"){
    // Android / 桌面：直接可用
  } else {
    hint.textContent = "摇一摇手机 · 或点一下签筒";
  }
}, 600);

/* ============================================================
   海报弹层交互
   ============================================================ */
const inviteBtn = document.getElementById("invite");

function openSheet(){
  if (!lastSign){ draw(); return; }
  sheetEl.classList.add("show");
  pBusy.classList.add("on");

  // 先确保二维码就绪再绘制
  const done = () => {
    buildPoster(lastSign, lastNum);
    pBusy.classList.remove("on");
  };
  if (window.__qrReady) done();
  else makeQR(SITE_URL, () => { window.__qrReady = true; done(); });
}

function closeSheet(){ sheetEl.classList.remove("show"); }

inviteBtn.addEventListener("click", openSheet);
document.getElementById("closeSheet").addEventListener("click", closeSheet);
sheetEl.addEventListener("click", e => { if (e.target === sheetEl) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* 保存图片 */
document.getElementById("savePoster").addEventListener("click", async () => {
  if (!posterBlob && !posterDataUrl) return;
  // 微信/移动端优先尝试长按保存，直接下载在微信内多半无效
  const isWX = /MicroMessenger/i.test(navigator.userAgent);
  if (isWX){
    toast("请长按海报图片 → 保存图片");
    return;
  }
  try {
    const url = URL.createObjectURL(posterBlob || await (await fetch(posterDataUrl)).blob());
    const a = document.createElement("a");
    a.href = url; a.download = `财富密码_${lastSign.rank}_${lastNum}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast("已保存，快去发给朋友吧");
  } catch (err){
    toast("请长按海报图片保存");
  }
});

/* 发给朋友（系统分享） */
document.getElementById("sharePoster").addEventListener("click", async () => {
  if (!posterBlob && !posterDataUrl) return;
  const isWX = /MicroMessenger/i.test(navigator.userAgent);
  const text = `我在「财富密码」摇到了${lastSign.rank}：${lastSign.poem}。你也来摇一摇？`;

  // 尝试分享文件（多数浏览器/APP 支持）
  try {
    let blob = posterBlob;
    if (!blob && posterDataUrl) blob = await (await fetch(posterDataUrl)).blob();
    const file = new File([blob], "财富密码.png", {type:"image/png"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], text, title:"财富密码"});
      return;
    }
  } catch (e){ /* 用户取消或失败，继续降级 */ }

  try {
    if (navigator.share){
      await navigator.share({title:"财富密码", text, url:SITE_URL});
      return;
    }
  } catch (e){}

  // 降级：复制链接
  try {
    await navigator.clipboard.writeText(text + " " + SITE_URL);
    toast(isWX ? "链接已复制，去微信群粘贴吧" : "链接已复制");
  } catch (e){
    toast("请长按海报图片 → 发送给朋友");
  }
});

setTimeout(() => {
  makeQR(SITE_URL, () => { window.__qrReady = true; });
}, 1200);
