<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7a1010">
<title>财富密码 · 摇一摇，抽一支属于你的签</title>
<meta name="description" content="摇一摇手机，从签筒里抽出一支签——上上签/上签/中签，看看你的签运！">
<meta itemprop="image" content="./share-lottery.png">
<meta property="og:type" content="website">
<meta property="og:title" content="财富密码 · 摇一摇，抽一支属于你的签">
<meta property="og:description" content="摇一摇手机，从签筒里抽出一支签，看看你的签运！">
<meta property="og:image" content="./share-lottery.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="财富密码 · 摇一摇，抽一支属于你的签">
<meta name="twitter:description" content="摇一摇手机，从签筒里抽出一支签，看看你的签运！">
<meta name="twitter:image" content="./share-lottery.png">
<style>
  :root{
    --wood1:#c8873f; --wood2:#a8672a; --wood3:#8a4f1d; --wood4:#6d3c12;
    --paper:#f6e7c8; --paper2:#e8d3a9;
    --gold1:#ffe9a8; --gold2:#e8b93f; --gold3:#b8842a; --gold4:#8a5f18;
    --ink:#3b1f0d;
    --red:#a81f1a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    background:
      radial-gradient(ellipse at 50% 30%, #b3241d 0%, #8d1712 45%, #5e0c0a 100%);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
    user-select:none;position:relative;
  }
  /* 背景暗纹 */
  body::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.10;
    background-image:radial-gradient(circle at 20% 15%, #ffd98a 0 1.5px, transparent 2px),
                     radial-gradient(circle at 75% 60%, #ffd98a 0 1.5px, transparent 2px),
                     radial-gradient(circle at 45% 85%, #ffd98a 0 1.2px, transparent 2px),
                     radial-gradient(circle at 88% 25%, #ffd98a 0 1.2px, transparent 2px);
    background-size:180px 180px,220px 220px,160px 160px,240px 240px;
  }
  #app{
    position:relative;width:min(94vw,430px);height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:8px 0 16px;
  }

  /* ========= 签筒 ========= */
  #tubeWrap{
    position:relative;
    width:min(64vw,220px);
    height:min(52vh,330px);
    display:flex;align-items:flex-end;justify-content:center;
    transition:transform .08s linear;
    will-change:transform;
  }
  /* 筒身：圆柱木质 */
  #tube{
    position:relative;width:100%;height:100%;
    border-radius:12px 12px 18px 18px;
    background:
      /* 竖向木纹 */
      repeating-linear-gradient(90deg,
        rgba(255,255,255,.07) 0 1px, transparent 1px 9px),
      linear-gradient(100deg,#b97a34 0%,#d1934a 18%,#c07f36 40%,#9d6224 68%,#7d4a17 100%);
    box-shadow:
      inset -18px 0 30px rgba(60,30,5,.45),
      inset 18px 0 26px rgba(255,220,150,.18),
      inset 0 -22px 30px rgba(50,25,5,.4),
      0 26px 44px rgba(0,0,0,.45);
    overflow:hidden;
  }
  /* 顶部筒口（椭圆） */
  #mouth{
    position:absolute;top:-14px;left:-3%;width:106%;height:34px;
    border-radius:50%;
    background:radial-gradient(ellipse at 50% 42%, #2a1103 0%, #45200a 52%, #6b3a14 88%, #8a4f1d 100%);
    box-shadow:inset 0 7px 12px rgba(0,0,0,.75), 0 3px 8px rgba(0,0,0,.4);
    z-index:5;
  }
  #mouth::after{
    content:"";position:absolute;inset:5px 10px;border-radius:50%;
    border:2px solid rgba(255,215,130,.35);
  }
  /* 筒身包边 */
  #tube::after{
    content:"";position:absolute;left:4%;right:4%;bottom:6%;height:16%;
    border-radius:6px;
    background:linear-gradient(180deg,rgba(255,220,140,.35),rgba(120,70,20,.35));
    border-top:2px solid rgba(255,225,150,.45);
    border-bottom:2px solid rgba(90,50,10,.5);
  }
  /* 竖排文字 */
  #label{
    position:absolute;inset:0;z-index:4;
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
    align-content:center;
    width:76%;margin:0 auto;left:0;right:0;
    gap:.06em .1em;padding-bottom:10%;
  }
  #label .ch{
    width:44%;
    display:flex;align-items:center;justify-content:center;
    font-family:"Songti SC","STSong","SimSun",serif;
    font-size:clamp(26px,8vw,36px);font-weight:900;line-height:1.1;
    color:#ffe9a8;letter-spacing:0;
    text-shadow:
      0 2px 0 #b8842a,
      0 3px 0 #8a5f18,
      0 4px 6px rgba(0,0,0,.55);
  }

  /* 筒里的签（露出一截） */
  #sticksInTube{
    position:absolute;top:-56px;left:12%;right:12%;height:70px;z-index:3;
    display:flex;justify-content:center;align-items:flex-end;gap:3px;
    pointer-events:none;
  }
  .stickIn{
    width:9px;border-radius:4px 4px 0 0;
    background:linear-gradient(180deg,#fdf0cf,#e6c489 60%,#c99a4e);
    box-shadow:0 1px 3px rgba(0,0,0,.3), inset -2px 0 0 rgba(140,90,30,.35);
    transform-origin:bottom center;
  }

  /* ========= 抽出的那根签 ========= */
  #drawnStick{
    position:absolute;z-index:20;
    left:50%;top:50%;
    width:min(40vw,138px);
    aspect-ratio:1/2.35;
    transform:translate(-50%,-56%) scale(.2) rotate(-8deg);
    opacity:0;pointer-events:none;
    transition:none;
  }
  #drawnStick.show{
    opacity:1;
  }
  .stickFace{
    position:absolute;inset:0;
    border-radius:10px;
    background:
      linear-gradient(100deg,#fffdf3 0%,#f7ecd2 30%,#efe0bd 62%,#dcc79c 100%);
    box-shadow:
      0 18px 40px rgba(0,0,0,.5),
      inset 0 0 0 2px rgba(190,150,90,.45),
      inset 0 0 22px rgba(190,160,110,.35);
    overflow:hidden;
    display:flex;flex-direction:column;align-items:center;
    padding:9% 8% 8%;
  }
  /* 签头红漆 */
  .stickTop{
    position:absolute;top:0;left:0;right:0;height:9%;
    background:linear-gradient(180deg,#c0392b,#96261c);
    border-radius:10px 10px 0 0;
    box-shadow:inset 0 -2px 3px rgba(0,0,0,.25);
  }
  .stickVert{
    margin-top:15%;
    writing-mode:vertical-rl;
    font-family:"Songti SC","STSong","SimSun",serif;
    font-size:clamp(22px,7vw,30px);font-weight:900;
    color:var(--red);letter-spacing:.14em;
    text-shadow:0 1px 0 rgba(255,255,255,.7);
  }
  .stickNum{
    margin-top:auto;
    font-family:"Songti SC","STSong",serif;
    font-size:clamp(15px,4.6vw,19px);font-weight:900;
    color:#8a5f18;letter-spacing:.08em;
  }
  .stickSeal{
    position:absolute;right:11%;bottom:9%;
    width:22%;aspect-ratio:1;border-radius:4px;
    background:#b7271f;color:#fff2d8;
    display:flex;align-items:center;justify-content:center;
    font-family:"Songti SC",serif;font-size:clamp(9px,2.8vw,12px);
    font-weight:700;line-height:1.05;text-align:center;
    box-shadow:0 2px 4px rgba(0,0,0,.3);
    transform:rotate(-6deg);
  }
  /* 抽出动画 */
  @keyframes pullOut{
    0%{transform:translate(-50%,-46%) scale(.55) rotate(-12deg);opacity:0;}
    35%{transform:translate(-50%,-88%) scale(.92) rotate(6deg);opacity:1;}
    55%{transform:translate(-50%,-96%) scale(1.02) rotate(-3deg);}
    72%{transform:translate(-50%,-76%) scale(1) rotate(2deg);}
    100%{transform:translate(-50%,-56%) scale(1) rotate(0deg);opacity:1;}
  }
  #drawnStick.anim{animation:pullOut .82s cubic-bezier(.3,1.3,.5,1) forwards;}

  /* ========= 文字区 ========= */
  #hint{
    position:absolute;bottom:9%;left:0;right:0;text-align:center;
    font-size:14px;color:#ffdca8;letter-spacing:2px;z-index:8;
    text-shadow:0 2px 6px rgba(0,0,0,.5);
    animation:breathe 2s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}

  #title{
    position:absolute;top:3.5%;left:0;right:0;text-align:center;z-index:8;
    font-family:"Songti SC","STSong",serif;
    font-size:clamp(24px,7vw,32px);font-weight:900;letter-spacing:.3em;
    color:#ffe9a8;text-indent:.3em;
    text-shadow:0 3px 0 #7a3d0e, 0 6px 16px rgba(0,0,0,.45);
  }

  /* 结果说明 */
  #reading{
    position:absolute;bottom:7%;left:0;right:0;z-index:8;
    text-align:center;opacity:0;transform:translateY(10px);
    transition:opacity .3s, transform .3s;
  }
  #reading.show{opacity:1;transform:translateY(0);}
  #reading .rk{
    font-family:"Songti SC",serif;font-size:clamp(16px,4.6vw,20px);
    font-weight:900;color:#ffd76e;letter-spacing:.2em;text-indent:.2em;
    text-shadow:0 2px 8px rgba(0,0,0,.6);
  }
  #reading .rd{
    margin-top:6px;font-size:13px;color:#ffd9b0;opacity:.85;
    letter-spacing:.05em;padding:0 24px;line-height:1.6;
    text-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  #again{
    margin-top:12px;border:none;cursor:pointer;font-family:inherit;
    padding:9px 20px;border-radius:999px;font-size:13.5px;font-weight:700;
    color:#8a1410;background:linear-gradient(180deg,#ffe9a8,#e8b93f);
    box-shadow:0 6px 16px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.6);
  }
  #again:active{transform:scale(.96);}

  /* 落下的签屑 */
  .confetti{position:absolute;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:30;}

  #toast{
    position:fixed;left:50%;bottom:14%;transform:translate(-50%,10px);
    background:rgba(40,10,5,.92);color:#ffe4b8;padding:10px 18px;border-radius:999px;
    font-size:13px;opacity:0;transition:all .25s;pointer-events:none;z-index:99;
    border:1px solid rgba(255,210,120,.25);
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}

  /* 摇动时整筒旋转 */
  .shaking{animation:tubeShake .16s linear infinite;}
  @keyframes tubeShake{
    0%{transform:rotate(0) translateX(0);}
    20%{transform:rotate(-5deg) translateX(-5px);}
    40%{transform:rotate(5deg) translateX(5px);}
    60%{transform:rotate(-4deg) translateX(-4px);}
    80%{transform:rotate(3deg) translateX(3px);}
    100%{transform:rotate(0) translateX(0);}
  }
</style>
</head>
<body>
<div id="app">
  <div id="title">财 富 密 码</div>

  <div id="tubeWrap">
    <div id="sticksInTube"></div>
    <div id="tube">
      <div id="label">
        <span class="ch">财</span>
        <span class="ch">密</span>
        <span class="ch">富</span>
        <span class="ch">码</span>
      </div>
    </div>
    <div id="mouth"></div>
  </div>

  <!-- 抽出的签 -->
  <div id="drawnStick">
    <div class="stickFace">
      <div class="stickTop"></div>
      <div class="stickVert" id="stickText">上上签</div>
      <div class="stickNum" id="stickNum">第 拾 陆 签</div>
      <div class="stickSeal">吉<br>祥</div>
    </div>
  </div>

  <div id="reading">
    <div class="rk" id="rkText"></div>
    <div class="rd" id="rdText"></div>
    <button id="again">再摇一签</button>
  </div>

  <div id="hint">摇一摇手机 · 抽一支签</div>
</div>
<div id="toast"></div>

<script>
/* ============ 签文数据 ============ */
const SIGNS = [
  {rank:"上上签", poem:"云开月出照乾坤", say:"久困将通，所求皆遂。眼前虽有薄雾，转瞬即见光明。"},
  {rank:"上上签", poem:"枯木逢春再发枝", say:"旧事翻新，否极泰来。所盼之人事，不日自有回音。"},
  {rank:"上上签", poem:"一箭中鹄喜非常", say:"心之所向，一击即中。放手去做，成算在手。"},
  {rank:"上签",   poem:"春风得意马蹄疾", say:"顺水行舟，得心应手。宜进取，忌迟疑。"},
  {rank:"上签",   poem:"雨过天青见彩虹", say:"困局渐解，好事将近。耐心再等一等。"},
  {rank:"上签",   poem:"贵人扶助过难关", say:"得人相助，事半功倍。多与人为善，福自会来。"},
  {rank:"中签",   poem:"静水行舟稳且长", say:"不急不躁，稳中求进。守得云开，自有月明。"},
  {rank:"中签",   poem:"半山看云待风来", say:"时机未到，先修己身。风起之日，自可高飞。"},
  {rank:"中签",   poem:"细水长流终入海", say:"積少成多，勿求速成。日日精进，终有所成。"},
  {rank:"上上签", poem:"紫气东来满庭芳", say:"福气临门，诸事咸宜。近来多有喜讯。"},
  {rank:"上签",   poem:"船到桥头自然直", say:"不必过忧，事到临头自有解法。放宽心。"},
  {rank:"上上签", poem:"锦上添花更添香", say:"已有之好，将更上一层。宜乘势而上。"},
];

/* 中文数字（签号用） */
const CN = ["零","一","二","三","四","五","六","七","八","九"];
function cnNum(n){
  if (n < 10) return "第 " + CN[n] + " 签";
  const t = Math.floor(n/10), u = n%10;
  let s = (t === 1 ? "十" : CN[t] + "十");
  if (u) s += CN[u];
  return "第 " + s + " 签";
}

const tubeWrap = document.getElementById("tubeWrap");
const drawn    = document.getElementById("drawnStick");
const stickText= document.getElementById("stickText");
const stickNum = document.getElementById("stickNum");
const reading  = document.getElementById("reading");
const rkText   = document.getElementById("rkText");
const rdText   = document.getElementById("rdText");
const hint     = document.getElementById("hint");
const again    = document.getElementById("again");

let busy = false;
let gotSign = false;

/* 加密级随机 */
function randInt(n){
  if (window.crypto && crypto.getRandomValues){
    const a = new Uint32Array(1);
    const limit = Math.floor(0xFFFFFFFF / n) * n;
    do { crypto.getRandomValues(a); } while (a[0] >= limit);
    return a[0] % n;
  }
  return Math.floor(Math.random() * n);
}

/* 筒里插着的签（随机高低） */
(function buildSticks(){
  const box = document.getElementById("sticksInTube");
  const heights = [58, 44, 62, 50, 66, 46, 56];
  heights.forEach((h, i) => {
    const d = document.createElement("div");
    d.className = "stickIn";
    d.style.height = (h + randInt(8)) + "px";
    d.style.transform = `rotate(${(randInt(7)-3)}deg)`;
    d.style.opacity = 0.9 - i*0.02;
    box.appendChild(d);
  });
})();

/* 摇一摇检测 */
let lastX = null, lastY = null, lastZ = null, lastShake = 0;
function onMotion(e){
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a || a.x == null) return;
  const now = Date.now();
  if (now - lastShake < 900) { lastX=a.x; lastY=a.y; lastZ=a.z; return; }
  if (lastX === null){ lastX=a.x; lastY=a.y; lastZ=a.z; return; }
  const dx = Math.abs(a.x - lastX), dy = Math.abs(a.y - lastY), dz = Math.abs(a.z - lastZ);
  const speed = dx + dy + dz;
  lastX=a.x; lastY=a.y; lastZ=a.z;
  if (speed > 26){
    lastShake = now;
    draw();
  }
}
function enableMotion(){
  if (window.DeviceMotionEvent){
    if (typeof DeviceMotionEvent.requestPermission === "function"){
      DeviceMotionEvent.requestPermission()
        .then(s => { if (s === "granted") window.addEventListener("devicemotion", onMotion); })
        .catch(() => {});
    } else {
      window.addEventListener("devicemotion", onMotion);
    }
  }
}
enableMotion();

/* 抽一签 */
function draw(){
  if (busy) return;
  busy = true;

  // 重置上一签
  drawn.classList.remove("show", "anim");
  reading.classList.remove("show");
  hint.style.display = "none";

  // 摇筒
  tubeWrap.classList.add("shaking");

  // 随机结果
  const idx = randInt(SIGNS.length);
  const sign = SIGNS[idx];
  const num = 1 + randInt(49);

  setTimeout(() => {
    tubeWrap.classList.remove("shaking");

    // 设置签上文字
    stickText.textContent = sign.rank;
    stickNum.textContent  = cnNum(num);

    // 抽出
    void drawn.offsetWidth;
    drawn.classList.add("show");
    drawn.classList.add("anim");

    // 签屑
    confetti();

    setTimeout(() => {
      rkText.textContent = sign.rank + " · " + sign.poem;
      rdText.textContent = sign.say;
      reading.classList.add("show");
      gotSign = true;
      busy = false;
    }, 520);

  }, 820);
}

/* 点击作为降级触发（桌面/无法倾斜传感器时） */
tubeWrap.addEventListener("click", draw);
again.addEventListener("click", draw);
window.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); draw(); }});

/* iOS 13+ 需要用户手势授权 */
tubeWrap.addEventListener("touchend", enableMotion, {once:true});

function confetti(){
  const r = drawn.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const colors = ["#e8b93f","#ffe9a8","#c0392b","#f6e7c8","#d4a03a"];
  for (let i=0;i<22;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.background = colors[randInt(colors.length)];
    c.style.left = cx+"px"; c.style.top = cy+"px";
    document.body.appendChild(c);
    const ang = Math.random()*Math.PI*2, d = 60 + Math.random()*140;
    c.animate([
      {transform:"translate(-50%,-50%) rotate(0) scale(1)", opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(ang)*d}px), calc(-50% + ${Math.sin(ang)*d + 70}px)) rotate(${randInt(360)}deg) scale(.4)`, opacity:0}
    ], {duration:700+Math.random()*500, easing:"cubic-bezier(.2,.6,.4,1)"})
     .onfinish = () => c.remove();
  }
}

let ttm;
function toast(m){
  const t = document.getElementById("toast");
  t.textContent = m; t.classList.add("show");
  clearTimeout(ttm); ttm = setTimeout(() => t.classList.remove("show"), 2000);
}

/* 首次提示 */
setTimeout(() => {
  if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission !== "function"){
    // Android / 桌面：直接可用
  } else {
    hint.textContent = "摇一摇手机 · 或点一下签筒";
  }
}, 600);
</script>
</body>
</html>
